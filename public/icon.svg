<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ebfc"/>
      <stop offset="1" stop-color="#d9cbf3"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f7f5fa"/>
      <stop offset="1" stop-color="#e4dfec"/>
    </linearGradient>
    <radialGradient id="neck" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#cfc6dd"/>
      <stop offset="1" stop-color="#ebe6f2"/>
    </radialGradient>
    <path id="shape" d="M190 84 C214 104 298 104 322 84 C352 92 392 108 424 126 C446 160 462 200 474 238 C452 252 424 262 398 268 L388 246 C384 300 386 380 390 446 C350 458 162 458 122 446 C126 380 128 300 124 246 L114 268 C88 262 60 252 38 238 C50 200 66 160 88 126 C120 108 160 92 190 84 Z"/>
    <clipPath id="shirt"><use href="#shape"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="drape" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="weave" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
    </filter>
    <filter id="print" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="1" seed="7" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Schlagschatten -->
  <use href="#shape" transform="translate(6 16)" fill="#4b2a8f" opacity="0.28" filter="url(#shadow)"/>

  <!-- Stoff -->
  <use href="#shape" fill="url(#cloth)"/>
  <g clip-path="url(#shirt)">
    <!-- Kragen-Innenseite -->
    <path d="M190 84 C214 104 298 104 322 84 C300 118 212 118 190 84 Z" fill="url(#neck)"/>
    <!-- Falten: breite, weiche Schatten -->
    <g fill="#7d7194" filter="url(#drape)">
      <path opacity="0.30" d="M118 240 C150 270 190 300 236 312 C206 318 170 304 140 284 C128 274 120 258 118 240 Z"/>
      <path opacity="0.26" d="M394 240 C368 276 330 304 288 318 C318 322 356 306 378 284 C390 272 394 258 394 240 Z"/>
      <path opacity="0.18" d="M182 330 C196 370 200 410 194 450 L174 450 C182 410 178 372 166 336 Z"/>
      <path opacity="0.20" d="M312 336 C330 372 338 410 336 450 L318 450 C320 410 312 374 296 342 Z"/>
      <path opacity="0.22" d="M88 128 C112 160 124 200 124 246 L104 250 C104 206 96 168 78 140 Z"/>
      <path opacity="0.22" d="M424 128 C400 160 388 200 388 246 L408 250 C408 206 416 168 434 140 Z"/>
      <path opacity="0.16" d="M200 100 C230 124 282 124 312 100 C292 136 220 136 200 100 Z"/>
    </g>
    <!-- Lichtkanten neben den Falten -->
    <g fill="#ffffff" filter="url(#drape)" opacity="0.95">
      <path d="M150 262 C184 290 220 300 256 300 C222 290 186 274 160 252 Z"/>
      <path d="M196 340 C208 380 212 414 208 450 L198 450 C202 414 198 380 186 344 Z"/>
      <path d="M330 340 C344 376 350 412 348 450 L338 450 C338 412 332 378 318 346 Z"/>
    </g>
    <!-- Wölbung: Schulterlicht, Schatten rechts -->
    <ellipse cx="200" cy="170" rx="110" ry="60" fill="#ffffff" opacity="0.7" filter="url(#soft)"/>
    <path d="M388 246 C384 300 386 380 390 446 L350 450 C360 380 362 300 370 250 Z" fill="#6e6188" opacity="0.10" filter="url(#soft)"/>
    <!-- Ärmelnähte und Saum -->
    <g fill="none" stroke="#c9c1d6" stroke-width="2" opacity="0.8">
      <path d="M124 246 C126 200 116 160 92 126"/>
      <path d="M388 246 C386 200 396 160 420 126"/>
      <path d="M122 438 C200 450 312 450 390 438" stroke-dasharray="4 4"/>
    </g>
    <!-- Abdunklung rechts unten, Stoffstruktur -->
    <rect width="512" height="512" filter="url(#weave)"/>
  </g>
  <!-- Kragenbündchen -->
  <path d="M190 84 C214 104 298 104 322 84" fill="none" stroke="#ddd6e8" stroke-width="9" stroke-linecap="round"/>
  <path d="M192 86 C216 106 296 106 320 86" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- Aufdruck -->
  <g filter="url(#print)">
    <text transform="translate(256 286) skewX(-12)" font-family="Arial, Helvetica, sans-serif" font-size="88" text-anchor="middle" fill="#4b2a8f" opacity="0.94">mots</text>
  </g>
</svg>
