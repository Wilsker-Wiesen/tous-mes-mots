# Cloudflare Worker: App hinter Passwort (kostenloser Workers-Plan, Konto wie parteigesicht).
# Veröffentlichen: npm run deploy  (importiert die CSV, baut, lädt hoch)
# Passwort einmalig setzen: npx wrangler secret put APP_PASSWORD
name = "tous-mes-mots"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Jede Anfrage läuft zuerst durch die Passwortprüfung, auch die Wortliste.
run_worker_first = true
